<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="498" viewBox="0 0 1280 498" role="img" aria-labelledby="title desc">
<title id="title">RealFin benchmark overview</title>
<desc id="desc">A Chinese financial question with a temporal constraint is presented with a selected palette from 85 tools. The agent grounds entities and dates, selects tools, executes and reasons over results. Evaluation in the paper considers answer accuracy and workflow quality against an executable reference, allowing valid alternative paths.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8b9f9d"/></marker></defs>
<rect x="1" y="1" width="1278" height="496" rx="16" fill="#fff" stroke="#dce4e2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="52" font-size="30" fill="#142c38" font-weight="700">From a question to an executable workflow</text>
<text x="32" y="88" font-size="20" fill="#596f78">A diagnostic benchmark for selection, grounding, and orchestration under tool explosion.</text>
<rect x="32" y="122" width="280" height="284" rx="12" fill="#f7f9fa"/><text x="54" y="160" font-size="18" font-weight="700" fill="#127d70">01</text><text x="54" y="199" font-size="25" font-weight="700" fill="#142c38">Financial task</text><text x="54" y="246" font-size="19" fill="#405763">Entities &amp; markets</text><text x="54" y="283" font-size="19" fill="#405763">Dates &amp; trading calendars</text><text x="54" y="320" font-size="19" fill="#405763">A concrete answer target</text><path d="M54 344H290" stroke="#d6e3df"/><text x="54" y="378" font-size="17" fill="#536c72">Fixed / Relative / Realtime</text><path d="M318 265H338" stroke="#8b9f9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="344" y="122" width="280" height="284" rx="12" fill="#f7f9fa"/><text x="366" y="160" font-size="18" font-weight="700" fill="#127d70">02</text><text x="366" y="199" font-size="25" font-weight="700" fill="#142c38">Tool exposure</text><text x="366" y="246" font-size="19" fill="#405763">Full palette · 85 tools</text><text x="366" y="283" font-size="19" fill="#405763">BM25 · top 20 tools</text><text x="366" y="320" font-size="19" fill="#405763">Oracle / OraA-k controls</text><path d="M366 344H602" stroke="#d6e3df"/><text x="366" y="378" font-size="17" fill="#536c72">Alternatives + dependencies</text><path d="M630 265H650" stroke="#8b9f9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="656" y="122" width="280" height="284" rx="12" fill="#f7f9fa"/><text x="678" y="160" font-size="18" font-weight="700" fill="#127d70">03</text><text x="678" y="199" font-size="25" font-weight="700" fill="#142c38">Agent workflow</text><text x="678" y="246" font-size="19" fill="#405763">Ground entities &amp; time</text><text x="678" y="283" font-size="19" fill="#405763">Select, call, and compose</text><text x="678" y="320" font-size="19" fill="#405763">Observe results &amp; recover</text><path d="M678 344H914" stroke="#d6e3df"/><text x="678" y="378" font-size="17" fill="#536c72">A ReAct-style interaction loop</text><path d="M942 265H962" stroke="#8b9f9d" stroke-width="2" marker-end="url(#arrow)"/><rect x="968" y="122" width="280" height="284" rx="12" fill="#f0f7f4"/><text x="990" y="160" font-size="18" font-weight="700" fill="#127d70">04</text><text x="990" y="199" font-size="25" font-weight="700" fill="#142c38">Evaluate</text><text x="990" y="246" font-size="19" fill="#405763">Answer accuracy</text><text x="990" y="283" font-size="19" fill="#405763">Execution reliability</text><text x="990" y="320" font-size="19" fill="#405763">Workflow quality</text><path d="M990 344H1226" stroke="#d6e3df"/><text x="990" y="378" font-size="17" fill="#536c72">Outcome + process metrics</text><circle cx="43" cy="453" r="5" fill="#127d70"/>
<text x="60" y="460" font-size="20" fill="#405763">Each task has one executable reference program; other valid solution paths are admissible.</text>
</g></svg>
